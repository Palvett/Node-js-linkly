services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkly}
      POSTGRES_DB: ${POSTGRES_DB:-linkly}
    volumes:
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-linkly} -d ${POSTGRES_DB:-linkly}']
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-linkly}:${POSTGRES_PASSWORD:-linkly}@db:5432/${POSTGRES_DB:-linkly}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
